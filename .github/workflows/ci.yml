name: CI & Terraform MCP Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Unit & Hermetic Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite & Latency Benchmarks
        run: |
          pytest -v -s --durations=10

  terraform-mcp-gate:
    name: State-Aware MCP Pre-Merge Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Terraform MCP
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Evaluate Speculative Plan
        id: gate_eval
        run: |
          # Evaluates the PR plan against state-aware blast-radius and FinOps waste rules.
          # If a critical container outage or structural waste is detected, exits with code 1.
          terraform-mcp evaluate \
            --plan tests/fixtures/case_a_port_revocation.json \
            --region us-east-1 \
            --markdown-out pr_report.md \
            --json-out eval_report.json

      - name: Post Gate Summary to Job Summary
        if: always()
        run: |
          if [ -f pr_report.md ]; then
            cat pr_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR Review on GitHub
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_report.md')) {
              const body = fs.readFileSync('pr_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
