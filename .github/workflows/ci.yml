name: CI & Terraform MCP Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for AWS OIDC STS token exchange
  contents: read
  pull-requests: write

jobs:
  test:
    name: Unit & Hermetic Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite & Latency Benchmarks
        run: |
          pytest -v -s --durations=10

  terraform-mcp-gate-demo:
    name: State-Aware MCP Gate Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Terraform MCP CLI
        run: |
          pip install -e ".[dev]"

      # Optional: In live AWS deployment, exchange OIDC token:
      # - name: Configure AWS Credentials via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/TerraformMcpReadOnlyGate
      #     aws-region: us-east-1

      - name: Evaluate Sample Plan (Case A: Port 8080 Revocation)
        id: gate_eval
        continue-on-error: true
        run: |
          terraform-mcp evaluate \
            --plan tests/fixtures/case_a_port_revocation.json \
            --region us-east-1 \
            --markdown-out pr_report.md \
            --json-out eval_report.json \
            --no-fail

      - name: Post Gate Summary to Job Summary
        if: always()
        run: |
          if [ -f pr_report.md ]; then
            cat pr_report.md >> $GITHUB_STEP_SUMMARY
          fi
