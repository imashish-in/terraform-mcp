name: Real AWS Terraform Verification & Deployment Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '**/*.tf'
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '**/*.tf'
  workflow_dispatch:
    inputs:
      auto_apply:
        description: 'Run terraform apply if plan is approved'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read
  pull-requests: write
  issues: write

jobs:
  real-aws-gate-and-deploy:
    name: Terraform Plan, MCP Gate & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with Real AWS (supports OIDC or Access Keys)
      - name: Configure AWS Credentials (OIDC Role)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS Credentials (Static Keys)
        if: env.AWS_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # 2. Setup Real Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 3. Setup Python & Install terraform-mcp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install terraform-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 4. Generate Real Terraform Plan JSON
      - name: Terraform Init & Plan
        id: tf_plan
        run: |
          TF_DIR="terraform"
          if [ ! -d "$TF_DIR" ]; then
            TF_DIR="."
          fi
          
          if ls $TF_DIR/*.tf 1> /dev/null 2>&1; then
            echo "Running terraform plan in $TF_DIR..."
            terraform -chdir=$TF_DIR init -input=false
            terraform -chdir=$TF_DIR plan -out=tfplan.binary -input=false
            terraform -chdir=$TF_DIR show -json tfplan.binary > tfplan.json
            echo "has_plan=true" >> $GITHUB_OUTPUT
            echo "tf_dir=$TF_DIR" >> $GITHUB_OUTPUT
          else
            echo "No .tf files found. Skipping plan."
            echo "has_plan=false" >> $GITHUB_OUTPUT
          fi

      # 5. Execute State-Aware MCP Gate against Real AWS
      - name: Evaluate Plan with Live AWS Topology & FinOps
        if: steps.tf_plan.outputs.has_plan == 'true'
        id: mcp_gate
        continue-on-error: true
        run: |
          terraform-mcp evaluate \
            --plan tfplan.json \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --markdown-out pr_report.md \
            --json-out eval_report.json

      # 6. Post Real-Time Audit Summary to GitHub PR Comment (on PRs)
      - name: Post PR Comment
        if: github.event_name == 'pull_request' && steps.tf_plan.outputs.has_plan == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_report.md')) {
              const body = fs.readFileSync('pr_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      # 7. Post Summary to GitHub Job Summary
      - name: Post Job Summary
        if: always()
        run: |
          if [ -f pr_report.md ]; then
            cat pr_report.md >> $GITHUB_STEP_SUMMARY
          fi

      # 8. Check Gate Verdict
      - name: Enforce Gate Verdict
        id: gate_verdict
        if: steps.tf_plan.outputs.has_plan == 'true'
        run: |
          python -c "
          import json, sys
          data = json.load(open('eval_report.json'))
          verdict = data.get('overall_verdict')
          print(f'Final Gate Verdict: {verdict}')
          if verdict in ('BLOCK_PR_CRITICAL_BLAST_RADIUS', 'BLOCK_PR_FINOPS_WASTE'):
              print('::error::Pull Request / Deploy BLOCKED by Live AWS State Inspection!')
              sys.exit(1)
          "

      # 9. Automatic Terraform Apply (on Main branch or Workflow Dispatch)
      - name: Terraform Apply to Real AWS
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.auto_apply == true)
        run: |
          TF_DIR="${{ steps.tf_plan.outputs.tf_dir }}"
          echo "🚀 Deploying approved Terraform infrastructure to Real AWS in $TF_DIR..."
          terraform -chdir=$TF_DIR apply -auto-approve tfplan.binary
